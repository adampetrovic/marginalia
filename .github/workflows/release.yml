name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: service/go.mod
          cache-dependency-path: service/go.sum

      - name: Run service tests
        working-directory: service
        run: go test ./... -race -count=1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: logseq-plugin/package-lock.json

      - name: Run plugin tests
        working-directory: logseq-plugin
        run: npm ci && npx vitest run

  docker:
    name: Docker Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: service
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [test, docker]
    steps:
      - uses: actions/checkout@v4

      # Build Logseq plugin
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: logseq-plugin/package-lock.json

      - name: Build Logseq plugin
        working-directory: logseq-plugin
        run: |
          npm ci
          npx vite build

      - name: Package Logseq plugin
        run: |
          cd logseq-plugin
          mkdir -p release
          cp -r dist package.json README.md 2>/dev/null release/ || true
          cd release && zip -r ../../logseq-plugin-marginalia.zip .

      # Package KOReader plugin
      - name: Package KOReader plugin
        run: |
          cp koreader-plugin/readwise.lua marginalia-koreader-readwise.lua

      # Create release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            logseq-plugin-marginalia.zip
            marginalia-koreader-readwise.lua
