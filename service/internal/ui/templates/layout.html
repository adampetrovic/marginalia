{{define "layout"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marginalia{{if .Title}} — {{.Title}}{{end}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    :root {
      --bg: #fafaf9; --surface: #ffffff; --border: #e7e5e4;
      --border-light: #f5f5f4; --text: #1c1917; --secondary: #78716c;
      --tertiary: #a8a29e; --accent: #b45309; --accent-hover: #92400e;
      --accent-light: #fef3c7; --success: #15803d; --success-bg: #f0fdf4;
      --error: #b91c1c; --error-bg: #fef2f2;
      --radius: 6px; --font: "Geist", system-ui, sans-serif;
      --mono: "Geist Mono", "SF Mono", monospace;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.55; font-size: 0.9375rem; -webkit-font-smoothing: antialiased; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-hover); }
    ::selection { background: var(--accent-light); }

    .wrap { max-width: 960px; margin: 0 auto; padding: 0 1.25rem; }

    /* ── Header ── */
    header { border-bottom: 1px solid var(--border); padding: 0.875rem 0; margin-bottom: 2rem; background: var(--surface); }
    header .wrap { display: flex; align-items: center; justify-content: space-between; }
    .wordmark { font-weight: 600; font-size: 0.9375rem; color: var(--text); letter-spacing: -0.01em; }
    .wordmark:hover { color: var(--text); }
    header nav { display: flex; gap: 1.5rem; }
    header nav a { color: var(--secondary); font-size: 0.8125rem; font-weight: 500; letter-spacing: 0.01em; transition: color 0.15s; }
    header nav a:hover { color: var(--text); }
    header nav a.active { color: var(--text); }

    /* ── Typography ── */
    h1 { font-size: 1.125rem; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 1.25rem; }
    h2 { font-size: 0.8125rem; font-weight: 500; color: var(--secondary); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.625rem; }

    /* ── Stats ── */
    .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; margin-bottom: 2rem; }
    .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; }
    .stat-value { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.03em; color: var(--text); font-variant-numeric: tabular-nums; }
    .stat-label { font-size: 0.75rem; color: var(--secondary); margin-top: 0.125rem; }

    /* ── Tables ── */
    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; padding: 0.5rem 0; color: var(--tertiary); font-weight: 500; font-size: 0.6875rem; text-transform: uppercase; letter-spacing: 0.06em; border-bottom: 1px solid var(--border); }
    td { padding: 0.625rem 0; border-bottom: 1px solid var(--border-light); font-size: 0.875rem; }
    th + th, td + td { padding-left: 1rem; }
    tr:last-child td { border-bottom: none; }

    /* ── Tags ── */
    .tag { display: inline-block; padding: 0.1rem 0.45rem; border-radius: 3px; font-size: 0.6875rem; font-weight: 500; letter-spacing: 0.02em; }
    .tag-book { background: #eff6ff; color: #1d4ed8; }
    .tag-article { background: #f0fdf4; color: #15803d; }
    .tag-completed { background: #f0fdf4; color: #15803d; }
    .tag-failed { background: #fef2f2; color: #b91c1c; }
    .tag-started { background: #fefce8; color: #a16207; }
    .tag-default { background: #f5f5f4; color: var(--secondary); }

    /* ── Buttons ── */
    .btn { display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.4375rem 0.875rem; border-radius: var(--radius); font-family: var(--font); font-size: 0.8125rem; font-weight: 500; border: none; cursor: pointer; transition: all 0.12s ease; white-space: nowrap; }
    .btn:active { transform: translateY(1px); }
    .btn-primary { background: var(--text); color: var(--bg); }
    .btn-primary:hover { background: #292524; }
    .btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { border-color: #d6d3d1; background: #fafaf9; }
    .btn-sm { padding: 0.25rem 0.625rem; font-size: 0.75rem; }
    .btn[disabled] { opacity: 0.4; cursor: not-allowed; }

    .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; margin-bottom: 1.5rem; }

    /* ── Forms ── */
    textarea { width: 100%; min-height: 200px; padding: 0.75rem; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius); font-family: var(--mono); font-size: 0.8125rem; line-height: 1.6; resize: vertical; }
    textarea:focus { outline: none; border-color: var(--secondary); box-shadow: 0 0 0 2px rgba(120,113,108,0.08); }
    input[type="text"], select { width: 100%; padding: 0.4375rem 0.625rem; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius); font-family: var(--font); font-size: 0.875rem; }
    input[type="text"]:focus, select:focus { outline: none; border-color: var(--secondary); box-shadow: 0 0 0 2px rgba(120,113,108,0.08); }
    label { display: block; font-size: 0.8125rem; font-weight: 500; color: var(--text); margin-bottom: 0.25rem; }
    .form-group { margin-bottom: 0.875rem; }
    .form-hint { font-size: 0.75rem; color: var(--tertiary); margin-top: 0.2rem; }

    /* ── Preview ── */
    .preview-pane { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.875rem; font-family: var(--mono); font-size: 0.8125rem; line-height: 1.6; white-space: pre-wrap; word-break: break-word; min-height: 140px; color: var(--secondary); }
    .preview-pane.has-content { color: var(--text); }

    .msg-error { color: var(--error); font-size: 0.8125rem; margin-top: 0.375rem; }
    .msg-success { color: var(--success); font-size: 0.8125rem; margin-top: 0.375rem; }

    .empty { padding: 2.5rem 1rem; text-align: center; color: var(--tertiary); font-size: 0.875rem; }

    .muted { color: var(--secondary); }
    .mono { font-family: var(--mono); font-size: 0.8125rem; }

    /* ── Two-column ── */
    .cols { display: grid; grid-template-columns: 1fr; gap: 1.5rem; }

    .htmx-indicator { display: none; }
    .htmx-request .htmx-indicator, .htmx-request.htmx-indicator { display: inline; }

    .section { margin-bottom: 2.5rem; }

    /* ── Tablet ── */
    @media (min-width: 640px) {
      .stats { grid-template-columns: repeat(4, 1fr); }
    }
    /* ── Desktop ── */
    @media (min-width: 860px) {
      .cols { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <a href="/" class="wordmark">Marginalia</a>
      <nav>
        <a href="/" {{if eq .Nav "dashboard"}}class="active"{{end}}>Highlights</a>
        <a href="/review" {{if eq .Nav "review"}}class="active"{{end}}>Review</a>
        <a href="/templates" {{if eq .Nav "templates"}}class="active"{{end}}>Templates</a>
        <a href="/history" {{if eq .Nav "history"}}class="active"{{end}}>Sync Log</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    {{template "content" .}}
  </main>
</body>
</html>
{{end}}
