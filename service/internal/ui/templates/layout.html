{{define "layout"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marginalia{{if .Title}} — {{.Title}}{{end}}</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    :root {
      --bg: #0f1117; --surface: #1a1d27; --border: #2a2d3a;
      --text: #e4e4e7; --muted: #71717a; --accent: #818cf8;
      --accent-hover: #6366f1; --success: #34d399; --error: #f87171;
      --warning: #fbbf24; --radius: 8px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; font-size: 0.95rem; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-hover); }

    .container { max-width: 1100px; margin: 0 auto; padding: 0 1rem; }

    /* ── Nav ── */
    nav { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0.6rem 0; margin-bottom: 1.5rem; }
    nav .container { display: flex; align-items: center; justify-content: space-between; }
    nav .logo { font-weight: 700; font-size: 1rem; color: var(--text); white-space: nowrap; }
    nav .logo span { color: var(--accent); }
    nav .links { display: flex; gap: 1rem; }
    nav .links a { color: var(--muted); font-size: 0.85rem; }
    nav .links a:hover, nav .links a.active { color: var(--text); }

    h1 { font-size: 1.3rem; margin-bottom: 0.75rem; font-weight: 600; }
    h2 { font-size: 1rem; margin-bottom: 0.5rem; font-weight: 600; color: var(--muted); }

    /* ── Cards ── */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; margin-bottom: 1rem; }

    /* ── Stats ── */
    .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; margin-bottom: 1.5rem; }
    .stat { text-align: center; }
    .stat .value { font-size: 1.75rem; font-weight: 700; color: var(--accent); }
    .stat .label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }

    /* ── Tables ── */
    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th { text-align: left; padding: 0.5rem 0.6rem; color: var(--muted); font-weight: 500; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid var(--border); white-space: nowrap; }
    td { padding: 0.5rem 0.6rem; border-bottom: 1px solid var(--border); }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(129,140,248,0.04); }

    /* ── Badges ── */
    .badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 999px; font-size: 0.7rem; font-weight: 500; white-space: nowrap; }
    .badge-book { background: rgba(129,140,248,0.15); color: var(--accent); }
    .badge-article { background: rgba(52,211,153,0.15); color: var(--success); }
    .badge-completed { background: rgba(52,211,153,0.15); color: var(--success); }
    .badge-failed { background: rgba(248,113,113,0.15); color: var(--error); }
    .badge-started { background: rgba(251,191,36,0.15); color: var(--warning); }
    .badge-default { background: rgba(113,113,122,0.15); color: var(--muted); }

    /* ── Buttons ── */
    .btn { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.5rem 1rem; border-radius: var(--radius); font-size: 0.85rem; font-weight: 500; border: none; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
    .btn-sm { padding: 0.3rem 0.7rem; font-size: 0.8rem; }
    .btn[disabled] { opacity: 0.5; cursor: not-allowed; }

    .actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; }

    /* ── Forms ── */
    textarea { width: 100%; min-height: 180px; padding: 0.75rem; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius); font-family: "SF Mono", "Fira Code", monospace; font-size: 0.8rem; line-height: 1.5; resize: vertical; }
    textarea:focus { outline: none; border-color: var(--accent); }
    input[type="text"], select { width: 100%; padding: 0.5rem 0.75rem; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius); font-size: 0.85rem; }
    input[type="text"]:focus, select:focus { outline: none; border-color: var(--accent); }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.3rem; }
    .form-group { margin-bottom: 1rem; }

    /* ── Preview ── */
    .preview-pane { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.75rem; font-family: "SF Mono", "Fira Code", monospace; font-size: 0.8rem; white-space: pre-wrap; word-break: break-word; min-height: 120px; color: var(--muted); overflow-x: auto; }
    .preview-pane.has-content { color: var(--text); }

    .error-msg { color: var(--error); font-size: 0.85rem; margin-top: 0.5rem; }
    .success-msg { color: var(--success); font-size: 0.85rem; margin-top: 0.5rem; }

    .empty { text-align: center; padding: 1.5rem; color: var(--muted); }

    /* ── Grid ── */
    .grid-2 { display: grid; grid-template-columns: 1fr; gap: 1rem; }

    .htmx-indicator { display: none; }
    .htmx-request .htmx-indicator { display: inline; }
    .htmx-request.htmx-indicator { display: inline; }

    /* ── Responsive: tablet+ ── */
    @media (min-width: 640px) {
      .container { padding: 0 1.5rem; }
      nav { margin-bottom: 2rem; }
      h1 { font-size: 1.5rem; }
      .stats { grid-template-columns: repeat(4, 1fr); }
      .stat .value { font-size: 2rem; }
      table { font-size: 0.9rem; }
    }

    /* ── Responsive: desktop ── */
    @media (min-width: 900px) {
      .grid-2 { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <nav>
    <div class="container">
      <a href="/ui/" class="logo"><span>◆</span> Marginalia</a>
      <div class="links">
        <a href="/ui/" {{if eq .Nav "dashboard"}}class="active"{{end}}>Highlights</a>
        <a href="/ui/templates" {{if eq .Nav "templates"}}class="active"{{end}}>Templates</a>
        <a href="/ui/history" {{if eq .Nav "history"}}class="active"{{end}}>Sync Log</a>
      </div>
    </div>
  </nav>
  <div class="container">
    {{template "content" .}}
  </div>
</body>
</html>
{{end}}
